<style>
:root{--f:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;--ink:#23324A;--bg:#FFF8DC;--frame:#FFD43B}
*{box-sizing:border-box}body{margin:0;font-family:var(--f);color:var(--ink);background:var(--bg);min-height:100vh;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
header{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto 14px}header img{width:72px}h1{margin:0;font-size:clamp(26px,4vw,40px)}
.langs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.langs button{font:inherit;border:0;border-radius:999px;padding:6px 12px;background:#fff;font-weight:700;cursor:pointer}.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1100px;margin:0 auto}
a.book{display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12);background:#fff;transition:transform .15s}a.book:active{transform:translateY(4px)}
.cv{height:170px;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}.cv img{max-width:100%;max-height:146px;object-fit:contain}
.bf .cv{background:linear-gradient(#6CC7FF,#BDE8FF)}.pl .cv{background:linear-gradient(#17457A,#0F2B4C)}
.tx{padding:12px 16px 16px}.tx b{display:block;font-size:22px}.tx span{font-size:15px;color:#5B6A80}
.soon{opacity:.55;pointer-events:none}.soon .cv{background:#E3F0FF;font-size:64px}
footer{max-width:1100px;margin:22px auto 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px;color:#5B6A80}footer .qr{width:120px;background:#fff;padding:6px;border-radius:12px}footer .qr svg{width:100%;height:auto;display:block}footer>div:last-child{flex:1;min-width:220px}
