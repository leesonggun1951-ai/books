<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>릴리의 나비 책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: Tinybop형 앱 화면. 표지 → [왼쪽 챕터 레일 | 위 섹터 탭 · 언어 줄 · 큰 장면]. 장면은 1600×900 세계를 카메라로 확대/이동 */
:root{
  --frame:#FFD43B; --frame2:#F6C21C; --rail:#FFF8DC; --card:#FFFFFF; --ink:#23324A; --ink2:#5B6A80;
  --tab:#E3F0FF; --tabOn:#FFE066; --blue:#1F8BFF; --green:#3DBE5A; --orange:#FF8A1F; --sky:#2EA3F2; --line:#FF7A00;
  --f:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--f);overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- 표지 ---------- */
#cover{position:fixed;inset:0;overflow:hidden;background:var(--sky)}
#cover .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cover .title{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;width:min(92%,900px)}
#cover h1{margin:0;font-family:var(--f);font-weight:700;font-size:clamp(34px,6.4vw,76px);line-height:1.05;color:#fff;
  text-shadow:0 4px 0 #1C6FD1,0 8px 24px rgba(0,0,0,.25);letter-spacing:.01em}
#cover .sub{margin-top:8px;font-size:clamp(15px,2vw,22px);color:#fff;font-weight:700;text-shadow:0 2px 0 #1C6FD1}
#coverLily{position:absolute;width:clamp(120px,18vw,230px);left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 12px rgba(0,0,0,.2))}
#start{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:clamp(22px,3vw,34px);font-weight:800;
  padding:12px 44px;border-radius:999px;box-shadow:0 6px 0 #C85E00,0 12px 28px rgba(0,0,0,.25)}
#start:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #C85E00}
#cover .langs{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.lg{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.lg[aria-pressed="true"]{background:var(--ink);color:#fff}
#tiltHint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 0 #1C6FD1;white-space:nowrap}

/* ---------- 책 ---------- */
#book{position:fixed;inset:0;display:grid;grid-template-columns:clamp(150px,19vw,250px) 1fr;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#rail{background:var(--rail);border-radius:22px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;box-shadow:inset 0 0 0 3px var(--frame2)}
.home{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;border-bottom:2px dashed #EADFB0;margin-bottom:2px}
.home .hb{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;display:grid;place-items:center;flex:0 0 auto}
.home b{font-family:var(--f);font-weight:700;font-size:18px;line-height:1.1}
.ch{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 8px;text-align:left;box-shadow:0 2px 0 #E9DDAE;position:relative;min-height:46px}
.ch .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.ch .ic{font-size:20px;flex:0 0 auto;width:24px;text-align:center}
.ch .t{font-size:15px;line-height:1.15;font-weight:700;min-width:0}
.ch[aria-current="true"]{background:var(--green);color:#fff;box-shadow:0 2px 0 #2A9443}
.ch[aria-current="true"] .n{background:#fff;color:var(--green)}
.ch .soon{position:absolute;right:6px;top:4px;font-size:10px;color:var(--ink2);font-weight:700}
.ch[aria-current="true"] .soon{color:#E8FFE9}
.ch .done{position:absolute;right:6px;bottom:2px;font-size:14px}
#main{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--tab);border-radius:16px;padding:8px 14px;font-size:clamp(15px,1.7vw,21px);font-weight:800;color:#1E4E8C;box-shadow:0 3px 0 #BFD6F2}
.tab .i{font-size:1.1em}
.tab[aria-selected="true"]{background:var(--tabOn);color:var(--ink);box-shadow:0 3px 0 #E0B800}
.tab:disabled{opacity:.45;cursor:default}
#langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#langs .lg{background:var(--card);box-shadow:0 2px 0 #E9DDAE}
#langs .lg[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
#vp{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:#6CC7FF;box-shadow:inset 0 0 0 3px var(--frame2);touch-action:none}
#world{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;will-change:transform}
#world>img.bgimg{position:absolute;left:0;top:0;width:1600px;height:900px;user-select:none;-webkit-user-drag:none}
#world img{user-select:none;-webkit-user-drag:none}
.sp{position:absolute;transform-origin:50% 50%;pointer-events:none}
.grab{pointer-events:auto;cursor:grab;touch-action:none}
#act{position:absolute;inset:0}
.mark{position:absolute;pointer-events:none}

/* HUD */
#bubble{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;max-width:min(76%,560px);pointer-events:none;transition:left .35s,top .35s;z-index:6}
#bubble .say{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 14px;font-size:clamp(16px,1.8vw,22px);line-height:1.3;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12);position:relative;display:flex;gap:8px;align-items:center}
#bubble .say::after{content:"";position:absolute;left:var(--ax,40px);top:-16px;border:9px solid transparent;border-bottom-color:#fff}
#bubble.side .say::after,#bubble.navon .say::after{display:none}
#bubble.up .say::after{top:auto;bottom:-16px;border-bottom-color:transparent;border-top-color:#fff}
#bubble.seethru .say{background:rgba(255,255,255,.42);box-shadow:none;text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 8px #fff,0 0 1px #fff}
#bubble.seethru .say::after{opacity:.28}
#bubble img{width:clamp(54px,6vw,78px);flex:0 0 auto;order:-1}
#spk{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:17px;display:grid;place-items:center}
#hud{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:70%}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.chip.on{background:var(--green);color:#fff}
.bigbtn{background:var(--orange);color:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #C85E00}
#card{position:absolute;left:12px;top:12px;bottom:12px;width:min(46%,430px);background:rgba(255,255,255,.96);border-radius:20px;padding:14px 16px;overflow-y:auto;box-shadow:0 6px 0 rgba(0,0,0,.1)}
#card h3{margin:0 0 8px;font-family:var(--f);font-weight:700;font-size:31px}
#card ul{margin:0 0 12px;padding-left:24px;font-size:22px;line-height:1.45;font-weight:600}
#card li{margin-bottom:6px}
.ptitle{font-weight:800;color:#C2410C;font-size:19px;margin-top:4px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.parts button{background:var(--tab);border-radius:999px;padding:5px 14px;font-weight:800;font-size:19px;color:#1E4E8C}
.parts button[aria-pressed="true"]{background:var(--line);color:#fff}
.vlink{display:inline-flex;gap:8px;align-items:center;background:#FF3B30;color:#fff;text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:800;font-size:19px}
.pick{--base:brightness(1);filter:var(--base) drop-shadow(2px 0 0 #FF2D2D) drop-shadow(-2px 0 0 #FF2D2D) drop-shadow(0 2px 0 #FF2D2D) drop-shadow(0 -2px 0 #FF2D2D);transition:filter .15s,scale .15s}
.pick:hover,.pick.hot{filter:var(--base) drop-shadow(0 0 3px #39FF14) drop-shadow(0 0 9px #39FF14) drop-shadow(0 0 16px #CCFF00);scale:1.06}
#world .sel5{filter:var(--base) drop-shadow(0 0 4px #39FF14) drop-shadow(0 0 12px #39FF14) drop-shadow(0 0 20px #CCFF00)!important;scale:1.08}
#bubble .bcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.gnav{display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:auto}
.gnav button{width:46px;height:46px;border-radius:50%;background:rgba(35,50,74,.8);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.gnav button:hover{background:rgba(35,50,74,.95)}
.gnav>span:not(.gnav),#gName{background:rgba(255,255,255,.8);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
#card li{cursor:pointer;border-radius:4px;transition:background .2s}
#card li.reading{background:linear-gradient(transparent 58%,rgba(204,255,0,.85) 58%)}
#game{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(94%,720px);max-height:calc(100% - 130px);overflow:auto;background:rgba(255,255,255,.96);border-radius:24px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.12);text-align:center;z-index:4}
#game .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:min(100%,calc((100vh - 330px)*1.75));margin:0 auto}
#game .cardb{aspect-ratio:4/3;border-radius:16px;background:#4E9A2E;display:grid;place-items:center;font-size:34px;color:#fff;font-weight:800;position:relative;overflow:hidden}
#game .cardb img{max-width:86%;max-height:86%;object-fit:contain}
#game .cardb.open{background:#FFF8DC}
#game .cardb.got{background:#E7F8E2;outline:3px solid #3DBE5A}
#game canvas{width:100%;max-width:min(520px,calc((100vh - 330px)*1.6));aspect-ratio:16/10;border-radius:16px;background:#fff;touch-action:none;border:2px solid #E9DDAE}
#game .pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#game .pal button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccc}
#game .pal button[aria-pressed="true"]{box-shadow:0 0 0 3px #23324A}
#game .pal .chip,#game .pal .bigbtn{width:auto;height:auto;border:0;border-radius:999px;padding:6px 16px}
#game .pal .chip{box-shadow:0 2px 0 rgba(0,0,0,.1)}
#autoBtn{background:var(--card);box-shadow:0 2px 0 #E9DDAE}
#autoBtn[aria-pressed="true"]{background:var(--green);color:#fff;box-shadow:none}
#hud .bigbtn.next{background:#3DBE5A;box-shadow:0 4px 0 #2A9443;font-size:20px;padding:10px 26px}
#quiz{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:min(92%,720px);background:rgba(255,255,255,.97);border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.12);text-align:center}
#quiz .qn{font-weight:800;color:var(--ink2);font-size:14px}
#quiz .q{font-family:var(--f);font-weight:700;font-size:clamp(20px,2.6vw,30px);margin:4px 0 12px}
#quiz .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#quiz .opt{background:var(--tab);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:clamp(15px,1.7vw,20px);min-height:110px;justify-content:center;box-shadow:0 4px 0 #BFD6F2}
#quiz .opt img{max-width:100%;height:64px;object-fit:contain}
#quiz .opt .big{font-size:46px;line-height:1}
#quiz .opt.right{background:var(--green);color:#fff;box-shadow:0 4px 0 #2A9443}
#quiz .opt.try{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lead{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;overflow:visible}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:var(--f);font-weight:700;font-size:clamp(34px,6vw,70px);color:#fff;text-shadow:0 4px 0 var(--orange),0 8px 20px rgba(0,0,0,.25);transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,170,40,.55),rgba(255,140,0,.18) 60%,rgba(255,140,0,0) 72%);pointer-events:none;transform:translate(-50%,-50%)}
@media (max-width:700px){
  #book{grid-template-columns:92px 1fr;gap:6px}
  .home b{display:none}
  .ch{flex-direction:column;gap:2px;padding:6px 4px;text-align:center}
  .ch .n{display:none}
  .ch .t{font-size:11px}
  .tab{padding:6px 10px}
  .tab .w{display:none}
  #card{width:auto;right:12px;bottom:auto;max-height:55%}
  #bubble{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<section id="cover">
  <img class="bg" id="coverBg" alt="">
  <div class="langs" id="coverLangs"></div>
  <div class="title"><h1 id="coverTitle"></h1><div class="sub" id="coverSub"></div></div>
  <img id="coverLily" alt="릴리">
  <button id="start"></button>
  <div id="tiltHint"></div>
</section>

<section id="book" hidden>

    </div>
  </div>
</section>

function silkLayer(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1600 900');Object.assign(svg.style,{position:'absolute',left:0,top:0,width:'1600px',height:'900px',pointerEvents:'none'});ACT().appendChild(svg);return svg}
function silkDraw(onLen){const svg=silkLayer();let cur=null,len=0,last=null;
  vp.onpointerdown=e=>{if(e.target.closest('#hud,#bubble,#card,#quiz'))return;vp.setPointerCapture(e.pointerId);last=toWorld(e.clientX,e.clientY);
    cur=document.createElementNS('http://www.w3.org/2000/svg','polyline');cur.setAttribute('fill','none');cur.setAttribute('stroke','rgba(255,255,255,.92)');cur.setAttribute('stroke-linecap','round');cur.setAttribute('stroke-linejoin','round');
    const pr=e.pointerType==='pen'?(e.pressure||.5):.5;cur.setAttribute('stroke-width',(2+pr*7).toFixed(1));cur.setAttribute('points',last.join(','));svg.appendChild(cur)};
  vp.onpointermove=e=>{if(!cur)return;const p=toWorld(e.clientX,e.clientY);len+=Math.hypot(p[0]-last[0],p[1]-last[1])*(e.pointerType==='pen'?(.5+(e.pressure||.5)):1);last=p;
    cur.setAttribute('points',cur.getAttribute('points')+' '+p.join(','));if(e.pointerType==='pen')cur.setAttribute('stroke-width',(2+(e.pressure||.5)*7).toFixed(1));onLen(len)};
  vp.onpointerup=vp.onpointercancel=()=>{cur=null};return()=>len}

function colorGame(ci){hideMarks();const g=$('#game');g.hidden=false;const W=800,H=500,cx=400;
  say(D('왼쪽이나 오른쪽 날개를 칠해 봐. 반대쪽도 똑같이 칠해져! S펜을 세게 누르면 붓이 굵어져.','Tô một bên cánh, bên kia cũng giống hệt! Nhấn S Pen mạnh thì nét to hơn.','Paint one wing and the other side copies it! Press the S Pen harder for a bigger brush.'));

  let down=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};

 no.onclick=()=>bg.remove();inp.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>inp.focus(),50);
 ok.onclick=async()=>{const pw=inp.value.trim();if(!pw){st.textContent='비밀번호를 넣어 주세요.';return}ok.disabled=true;st.textContent='저장 공간을 설치하는 중입니다… (처음은 10~30초)';
  try{const r=await (await fetch(MEMO_API,{method:'POST',body:JSON.stringify({op:'init',pw,report:REPORT})})).json();
   if(!r.ok){st.textContent=r.error==='password'?'비밀번호가 맞지 않습니다.':'설치하지 못했습니다: '+r.error;ok.disabled=false;return}

  try{const src=await (await fetch(location.href)).text();if(!RE.test(src))throw 0;const b=new Blob([src.replace(RE,block())],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=decodeURIComponent(location.pathname.split('/').pop()||document.title+'.html');a.click();msg('메모가 들어간 파일을 내려받았습니다. 4) ai 폴더의 같은 파일에 덮어쓰세요.')}
  catch(e){msg('이 화면에서는 저장할 수 없습니다. 컴퓨터에서 H:\\4) ai 의 파일을 열어 저장하세요.')}return}

  if(!fh){msg('처음 한 번만: 지금 보고 있는 이 HTML 파일을 골라 주세요');[fh]=await window.showOpenFilePicker({types:[{description:'HTML',accept:{'text/html':['.html']}}]});if((await fh.requestPermission({mode:'readwrite'}))!=='granted')return;}
  const src=await (await fh.getFile()).text();
  if(!RE.test(src)||src.indexOf('<title>'+document.title)<0){msg('다른 파일입니다. 이 보고서 파일을 골라 주세요.');try{await idb('readwrite',s=>s.delete(KEY))}catch(e){}return}
  const w=await fh.createWritable();await w.write(src.replace(RE,block()));await w.close();
  try{await idb('readwrite',s=>s.put(fh,KEY))}catch(e){}
  dirty=false;try{localStorage.removeItem(KEY)}catch(e){}
  saveBtn.classList.remove('mm-dirty');saveBtn.textContent='저장';msg('저장했습니다 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' — 구글 드라이브에도 곧 올라갑니다');

async function initDB(){if(!(window.claude&&claude.use))return null;try{const db=await claude.use('db');if(!db)return null;const ref=db.doc('memo/state');NC=db.collection('memo/state/notes');
 const race=p=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
 const snap=await race(ref.get());let sv=null;if(snap&&snap.exists){const d=snap.data();if(d&&d.json)sv=JSON.parse(d.json)}
 const qs=await race(NC.limit(1000).get());const notes=[];(qs.docs||[]).forEach(dc=>{const d=dc.data();if(d&&d.json){try{const n=JSON.parse(d.json);notes.push(n);SAVED[n.id]=d.json}catch(_){}}});
 if(sv){if(Array.isArray(sv.notes)&&sv.notes.length){sv.notes.forEach(n=>{if(!SAVED[n.id])notes.push(n)})}
  const merged={v:1,ts:sv.ts||0,hl:sv.hl||[],notes:notes};notes.sort((a,b)=>(a.t||0)-(b.t||0));
  if(!(dirty&&data.ts>(merged.ts||0)))data=merged;if(sv.v===2)SAVEDST=JSON.stringify(sv.hl||[])}
 else if(notes.length&&!(dirty)){data={v:1,ts:0,hl:[],notes:notes}}
 dref=ref;if(sv&&Array.isArray(sv.notes))dirty=true;return db}catch(e){return null}}
(async()=>{DB=await initDB();if(DB)initAns();if(!DB&&window.claude){saveBtn.textContent='로그인 필요';saveBtn.title='claude.ai에 로그인해야 메모가 저장됩니다'}if(DB){saveBtn.textContent=dirty?'저장 중…':'저장됨';saveBtn.title='메모는 자동으로 저장되고 어느 기기에서 열어도 보입니다';if(dirty)tmr=setTimeout(dbWrite,500)}

 for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;s+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0]+' '+p2[1]}return s}
const esc=t=>String(t).replace(/[<&>"]/g,'');
function render(){size();let h='';D.forEach((d,i)=>{const c=d.c||'#b3261e',w=d.w||.7;

 else{h+='<path d="'+pathOf(d)+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';const e=d.p[d.p.length-1],s0=d.p[0];if(!d.z)h+='<circle cx="'+s0[0]+'" cy="'+s0[1]+'" r="1" fill="'+c+'"/>';
  if(d.z){}else if(d.a){const pv=d.p[d.p.length-2],an=Math.atan2(e[1]-pv[1],e[0]-pv[0]),L=3;h+='<path d="M'+e[0]+' '+e[1]+'L'+(e[0]-L*Math.cos(an-.45))+' '+(e[1]-L*Math.sin(an-.45))+'L'+(e[0]-L*Math.cos(an+.45))+' '+(e[1]-L*Math.sin(an+.45))+'Z" fill="'+c+'"/>'}else h+='<circle cx="'+e[0]+'" cy="'+e[1]+'" r="1" fill="'+c+'"/>'}
 if(d.t){const x=d.k==='ellipse'?d.cx:d.p[d.p.length-1][0],y=(d.k==='ellipse'?d.cy-d.ry:d.p[d.p.length-1][1])-2;h+='<text x="'+x+'" y="'+y+'" font-size="3.6" font-weight="800" fill="'+c+'" paint-order="stroke" stroke="#fbfaf6" stroke-width="1.2">'+esc(d.t)+'</text>'}});
 if(cur!=null&&pts.length>1)h+='<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="'+color+'" stroke-width=".5" stroke-dasharray="1 1"/>';layer.innerHTML=h}
function hitD(d,p,R){if(d.k==='ellipse'){for(let k=0;k<48;k++){const a1=k/48*2*Math.PI,a2=(k+1)/48*2*Math.PI;if(segDist(p,[d.cx+d.rx*Math.cos(a1),d.cy+d.ry*Math.sin(a1)],[d.cx+d.rx*Math.cos(a2),d.cy+d.ry*Math.sin(a2)])<=R)return true}return false}
 const P=d.p||[];if(P.length===1)return dist(p,P[0])<=R;for(let i=1;i<P.length;i++)if(segDist(p,P[i-1],P[i])<=R)return true;return false}
function snap(){HIST.push(JSON.stringify(D));if(HIST.length>60)HIST.shift()}
function changed(){clearTimeout(tmr);tmr=setTimeout(save,800)}
async function save(){const j=JSON.stringify(D);try{localStorage.setItem('mm-draw:'+document.title,j)}catch(_){}if(dref){try{await dref.set({json:j,ts:Date.now()})}catch(_){}}}
function eraseAt(e){const p=toMM(e),R=16*mmPerPx(),n=D.length;let first=true;for(let i=D.length-1;i>=0;i--)if(hitD(D[i],p,R)){if(first){snap();first=false}D.splice(i,1)}if(D.length!==n){render();changed()}}
/* 도구 줄 */
const bar=document.createElement('div');bar.id='mmdbar';bar.className='mm-ui';
bar.innerHTML='<b>그리기</b><button data-c="#b3261e" style="--k:#b3261e" aria-pressed="true">빨강</button><button data-c="#1d6fb8" style="--k:#1d6fb8" aria-pressed="false">파랑</button><button data-c="#15803d" style="--k:#15803d" aria-pressed="false">초록</button><button data-c="#1d2328" style="--k:#1d2328" aria-pressed="false">검정</button><button class="da" aria-pressed="false">→ 화살표</button><button class="dsm" aria-pressed="false" title="켜면 그린 선을 직선·원·네모·세모로 다듬습니다 (기본은 그린 그대로)">다듬기</button><input class="dl" placeholder="다음 선에 붙일 글(선택)" maxlength="40"><button class="de" aria-pressed="false">지우개</button><button class="du">되돌리기</button><button class="dx">닫기</button>';
document.body.appendChild(bar);
const say=t=>{let m=document.getElementById('tnote');if(!m&&t){m=document.createElement('div');m.id='tnote';m.className='mm-ui';document.body.appendChild(m)}if(m&&t){m.textContent=t;m.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>{m.hidden=true},2500)}};
bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;bar.querySelector('.de').setAttribute('aria-pressed','false');bar.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
bar.querySelector('.dsm').onclick=function(){smooth=!smooth;this.setAttribute('aria-pressed',smooth);say(smooth?'다듬기 켬 · 직선·원·네모로 맞춥니다':'다듬기 끔 · 그린 그대로 남깁니다')};
bar.querySelector('.da').onclick=function(){arrow=!arrow;this.setAttribute('aria-pressed',arrow)};
bar.querySelector('.de').onclick=function(){erase=!erase;this.setAttribute('aria-pressed',erase);if(!erase)ring.style.display='none'};
bar.querySelector('.du').onclick=()=>{if(!HIST.length)return;D=JSON.parse(HIST.pop());render();changed()};
bar.querySelector('.dx').onclick=()=>setMode(false);
let btn=null;
const tablet=()=>document.documentElement.classList.contains('mm-penonly')||matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
function setMode(on){const was=mode;mode=on;window.__mmLock&&window.__mmLock(on);document.documentElement.classList.toggle('mm-drawing',on);if(tablet()&&was!==on)say(on?'그리기 중 · 화면이 고정됩니다 (닫기나 ✏️ 그리기를 다시 누르면 풀림)':'화면 이동이 다시 됩니다');if(btn)btn.setAttribute('aria-pressed',on);if(!on){erase=false;bar.querySelector('.de').setAttribute('aria-pressed','false');ring.style.display='none'}render()}
/* 그리기: 펜·마우스만 (손가락은 화면 이동) */
addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(e.pointerType==='touch')tch++},true);addEventListener('pointerup',e=>{if(e.pointerType==='touch')tch=Math.max(0,tch-1)},true);addEventListener('pointercancel',e=>{if(e.pointerType==='touch')tch=Math.max(0,tch-1)},true);
/* 펜·마우스로 그림. 펜이 없는 태블릿은 손가락 하나로도 그림(두 손가락 이상·손바닥은 무시) */
layer.addEventListener('pointerdown',e=>{if(!mode||(e.pointerType==='touch'&&(penSeen||tch>1||(e.width||0)>=50))||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();e.stopPropagation();
 if(erase){er=e.pointerId;eraseAt(e);return}cur=e.pointerId;pts=[toMM(e)];try{layer.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(cur!=null&&e.pointerId===cur&&e.pointerType==='touch'&&tch>1){cur=null;pts=[];render();return}const on=mode&&erase&&e.pointerType!=='touch';ring.style.display=on?'block':'none';if(on){ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px'}
 if(er!=null&&e.pointerId===er){eraseAt(e);return}if(cur==null||e.pointerId!==cur)return;const p=toMM(e);if(dist(p,pts[pts.length-1])>.5){pts.push(p);render()}});
const endStroke=e=>{if(er!=null&&e.pointerId===er){er=null;return}if(cur==null||e.pointerId!==cur)return;cur=null;const f=smooth?fit(pts):free(pts);pts=[];
 if(f){snap();f.c=color;if(arrow&&f.k!=='ellipse')f.a=1;const li=bar.querySelector('.dl'),lab=li.value.trim();if(lab){f.t=lab;li.value=''}D.push(f);changed();if(smooth)say(f.k==='line'?'직선으로 다듬었습니다':f.k==='ellipse'?'원으로 다듬었습니다':f.z?'도형으로 다듬었습니다':'선으로 다듬었습니다')}render()};addEventListener('pointerup',endStroke);addEventListener('pointercancel',endStroke);
addEventListener('keydown',e=>{if(e.key==='Escape'&&mode)setMode(false)});
addEventListener('resize',()=>requestAnimationFrame(render));
try{new ResizeObserver(()=>requestAnimationFrame(render)).observe(HOST)}catch(_){}
/* 메모 줄에 단추 넣기 (인쇄 다음) */
function addBtn(){const mb=document.querySelector('.mm-bar');if(!mb)return false;if(mb.querySelector('.mm-draw'))return true;btn=document.createElement('button');btn.type='button';btn.className='mm-draw';btn.textContent='✏️ 그리기';btn.title='문서 위에 선·화살표·원 그리기 (Esc로 끄기)';btn.setAttribute('aria-pressed','false');btn.onclick=e=>{e.preventDefault();setMode(!mode)};
 const pr=mb.querySelector('.mm-print');if(pr)pr.after(btn);else mb.insertBefore(btn,mb.firstChild);return true}
if(!addBtn()){let n=0;const iv=setInterval(()=>{if(addBtn()||++n>40)clearInterval(iv)},250)}
/* 불러오기 */
try{const j=localStorage.getItem('mm-draw:'+document.title);if(j)D=JSON.parse(j)||[]}catch(_){}
render();
(async()=>{if(!(window.claude&&claude.use))return;try{DB=await claude.use('db');if(!DB)return;dref=DB.doc('memo/draw');const sn=await Promise.race([dref.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);if(sn&&sn.exists){const d=sn.data();if(d&&d.json){D=JSON.parse(d.json)||[];render()}}}catch(_){}})();
})();
</script>
