<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>릴리의 수학 책</title>
<meta name="theme-color" content="#EFE6D6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Gaegu:wght@700&family=Patrick+Hand&display=swap">
<style>
/* Layout: 책상 위 모눈 종이(3D 무대) 위에 떠 있는 흰 카드들 — 왼쪽 장 목록·공식 카드 | 위 알약 탭·언어 | 오른쪽 위 측정 카드 | 아래 가운데 조절 막대 | 왼쪽 아래 릴리 */
:root{
  --desk:#C9A27A; --paper:#F6F1E7; --card:rgba(255,253,249,.94); --cardSolid:#FFFDF9; --line:#E4D9C5; --line2:#D6C7AE;
  --ink:#2B2620; --ink2:#7B705F; --accent:#E8742A; --accentD:#C45A17; --accentL:#FCE6D3; --cut:#FFCF45;
  --sh:0 8px 22px rgba(86,62,30,.14),0 1px 3px rgba(86,62,30,.14);
  --shUp:0 12px 28px rgba(86,62,30,.20),0 2px 6px rgba(86,62,30,.16);
  --serif:"Noto Serif","Noto Serif KR",Georgia,serif;
  --sans:"IBM Plex Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --hand:"Patrick Hand","Gaegu",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#E6D9C3;color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 단추: 평소 흰 알약 + 옅은 그림자, 손을 대면 살짝 떠오르고 주황 테두리, 고른 것만 주황 */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--cardSolid);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;
  box-shadow:0 2px 5px rgba(86,62,30,.12);transition:transform .15s,box-shadow .15s,border-color .15s;white-space:nowrap}
.pill:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(86,62,30,.18);border-color:var(--accent)}
.pill:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(86,62,30,.14)}
.pill[aria-pressed="true"],.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(196,90,23,.35)}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(196,90,23,.35)}
.pill.pri:hover{background:var(--accentD)}
.pill:disabled{opacity:.45;cursor:default;transform:none}

/* 위 줄 */
#top{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;z-index:10;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;font-family:var(--serif);font-weight:700;font-size:20px;white-space:nowrap}
#brand svg{width:28px;height:28px}
#homeBtn{display:flex;align-items:center;gap:8px}
#tabs{justify-self:center;display:flex;gap:4px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tab{padding:7px 16px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap;color:var(--ink);transition:background .15s,color .15s,box-shadow .15s}
.tab:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(196,90,23,.35)}
#langs{display:flex;gap:4px;padding:4px;border-radius:999px;flex-wrap:nowrap}
#langs .pill{padding:5px 10px;font-size:13px;box-shadow:none}

/* 왼쪽 장 목록 */
#left{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));width:220px;z-index:9;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 200px)}
#chs{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ch{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;text-align:left;font-weight:600;font-size:15px;position:relative;transition:background .15s}
.ch:hover{background:var(--accentL)}
.ch .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:0 0 auto;background:#fff}
.ch[aria-current="true"]{background:var(--accentL)}
.ch[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.ch .g{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:500}
.ch.soon{color:var(--ink2)}
.ch .ok{color:var(--accent);font-weight:700;margin-left:4px}
#fcards{display:flex;flex-direction:column;gap:8px}
.fc{display:flex;align-items:center;gap:10px;padding:9px 12px;text-align:left}
.fc:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shUp)}
.fc{transition:transform .15s,box-shadow .15s,border-color .15s}
.fc svg{width:30px;height:30px;flex:0 0 auto}
.fc .fx{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25}
.fc .fx i{font-style:italic}
.fc .fl{display:block;font-family:var(--sans);font-size:11.6px;color:var(--ink2);font-weight:500}

/* 오른쪽 측정 카드 */
#meas{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:270px;padding:12px 14px;z-index:9}
#meas h3{margin:0 0 6px;font-family:var(--serif);font-size:18px;display:flex;align-items:center;gap:8px}
#meas h3 svg{width:20px;height:20px}
#meas .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
#meas .row:first-of-type{border-top:0}
#meas .k{color:var(--ink2);font-size:13.5px;flex:0 1 auto}
#meas .v{font-family:var(--mono);font-weight:600;font-size:16px;text-align:right}
#meas .v.hi{color:var(--accentD);font-family:var(--sans);font-weight:700;font-size:17px}
#meas .note{margin-top:6px;font-size:13px;color:var(--ink2);line-height:1.45}

/* 아래 조절 막대 */
#ctl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;padding:10px 14px;display:flex;flex-direction:column;gap:8px;
  width:min(660px,calc(100% - 640px));min-width:420px}
#ctl:empty{display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.seg{display:inline-flex;background:#F3ECDF;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:center}
.seg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.seg button:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accentD);box-shadow:0 2px 6px rgba(86,62,30,.18)}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%}
.sl .lab{font-weight:600;font-size:14px;white-space:nowrap}
.sl .val{font-family:var(--mono);font-weight:600;min-width:64px;text-align:right}
.sl input{width:100%;accent-color:var(--accent);height:26px}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:0 4px;margin-top:-6px}
.axis b{font-weight:600;color:var(--ink)}

/* 릴리 */
#lily{position:fixed;left:calc(max(12px,env(safe-area-inset-left,0px)) + 232px);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:flex-end;gap:8px;max-width:min(376px,calc(100% - 684px));min-width:230px;pointer-events:none}
#lily svg{width:64px;height:76px;flex:0 0 auto;filter:drop-shadow(0 4px 6px rgba(86,62,30,.18))}
#say{pointer-events:auto;padding:10px 12px 10px 14px;font-size:15.5px;line-height:1.45;font-weight:500;display:flex;gap:8px;align-items:flex-start;border-radius:18px 18px 18px 6px}
#say:empty{display:none}
#spk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px}
#spk:hover{border-color:var(--accent)}

/* 퀴즈·안내 카드 */
#panel{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100% - 600px));min-width:340px;padding:16px 18px;z-index:11;text-align:center}
#panel .qn{font-size:13px;color:var(--ink2);font-family:var(--mono)}
#panel .q{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.35;margin:6px 0 12px}
#panel .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#panel .opt{padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;box-shadow:0 2px 5px rgba(86,62,30,.12);transition:transform .15s,border-color .15s}
#panel .opt:hover{border-color:var(--accent);transform:translateY(-1px)}
#panel .opt.right{background:var(--accent);border-color:var(--accent);color:#fff}
#panel .opt.wrong{animation:shake .4s;border-color:#C9B9A0;color:var(--ink2)}
#panel .why{margin-top:10px;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--accentL);border-radius:12px;padding:8px 12px;text-align:left}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 3D 이름표 */
#tags{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-50%);background:rgba(255,253,249,.92);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(86,62,30,.14)}
.tag.big{font-family:var(--sans);font-size:15px;padding:4px 12px}
.tag.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.tag.y{background:#FFF4CC;border-color:#E9C24A}

/* 주석 카드 + 설명용 이름표 (교재 3D 색은 판정 뜻 없음) */
#note{position:fixed;right:max(12px,env(safe-area-inset-right,0px));width:270px;padding:12px 14px;z-index:9}
#note h3{margin:0 0 6px;font-family:var(--serif);font-size:17px;display:flex;align-items:center;gap:8px;justify-content:space-between}
#note ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
#note li{font-size:14.5px;line-height:1.5;padding:4px 8px;border-radius:8px;cursor:pointer;transition:background .2s,box-shadow .2s}
#note li .k{font-family:var(--mono);font-weight:600}
#note li.on{background:#D9FF7A;box-shadow:0 0 0 2px #A3FF00,0 0 14px 3px rgba(163,255,0,.55)}
#note .play{padding:5px 12px;font-size:13px}
.tag.fn{font-family:var(--sans);font-weight:700;font-size:17px;color:#D9601A;background:rgba(255,253,249,.9);border:2px solid #E8742A;border-radius:50%;width:32px;height:32px;padding:0;display:grid;place-items:center;box-shadow:none}
.tag.one{font-family:var(--mono);font-weight:700;font-size:15px;color:#D9601A;background:transparent;border:0;box-shadow:none;padding:0 2px}
.tag.len{font-family:var(--mono);font-weight:700;font-size:16px;color:#1F5FD1;background:rgba(255,253,249,.9);border:1.5px solid #2F7BEA}
.tag.glow{background:#D9FF7A!important;border-color:#5FBF00!important;color:#14420A!important;box-shadow:0 0 0 3px #A3FF00,0 0 18px 6px rgba(163,255,0,.75)!important;transform:translate(-50%,-50%) scale(1.18)}
.tag{transition:transform .2s,box-shadow .2s,background .2s}
@media (max-width:760px){#note{top:auto!important;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:10px;right:10px;width:auto;max-height:28vh;overflow:auto}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);opacity:0;z-index:30;pointer-events:none;font-family:var(--serif);font-weight:700;font-size:clamp(28px,5vw,54px);
  color:var(--accentD);background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:22px;padding:10px 26px;box-shadow:var(--shUp);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 표지 */
#cover{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:flex-start;padding-left:max(24px,6vw);pointer-events:none}
@media (max-width:760px){#cover{justify-content:center;padding-left:0;align-items:flex-end;padding-bottom:24px}}
#cover .cc{pointer-events:auto;width:min(560px,calc(100% - 32px));padding:26px 28px 22px;text-align:center}
#cover .stamp{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--accentD);border:1px solid var(--accent);border-radius:999px;padding:3px 12px}
#cover h1{font-family:var(--serif);font-size:clamp(34px,6vw,52px);margin:12px 0 6px;line-height:1.1;text-wrap:balance}
#cover p{margin:0 0 18px;color:var(--ink2);font-size:16px;line-height:1.5;text-wrap:balance}
#cover .cl{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
#cover .cl .pill{padding:5px 12px;font-size:14px}
#start{font-size:20px;padding:12px 40px}
#cover .hint{margin-top:12px;font-size:13px;color:var(--ink2)}

/* 261120 설명 카드(나레이션·주석·측정): 글자 115%, 바탕 40% 반투명 시험 — 글자는 흰 테두리로 또렷하게 */
#say,#note,#meas{background:rgba(255,253,249,.4);border-color:rgba(214,199,174,.75);box-shadow:0 4px 14px rgba(86,62,30,.10);backdrop-filter:none;-webkit-backdrop-filter:none;
  text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 7px #fff,0 0 1px #fff}
#say{font-size:17.8px}
#meas{width:300px}#meas h3{font-size:20.7px}#meas .k{font-size:15.5px}#meas .v{font-size:18.4px}#meas .v.hi{font-size:19.6px}#meas .note{font-size:15px}#meas .row{border-top-color:rgba(214,199,174,.6)}
#note{width:300px}#note h3{font-size:19.5px}#note li{font-size:16.7px}#note .play{font-size:15px;text-shadow:none}
#say button,#note button{text-shadow:none}
@media (max-width:980px){
  #left{width:184px}#lily{left:calc(max(12px,env(safe-area-inset-left,0px)) + 196px)}
  #meas{width:260px}#note{width:260px}#ctl{width:calc(100% - 560px);min-width:380px}
  #panel{width:calc(100% - 460px)}
}
@media (max-width:760px){
  #top{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  #tabs{grid-column:1/-1;grid-row:2;justify-self:stretch}
  #brand span{display:none}
  #left{top:calc(112px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:none}
  #chs{flex-direction:row;overflow-x:auto;padding:5px}.ch{flex:0 0 auto;padding:5px 8px}.ch .g{display:none}
  #fcards{display:none}
  #meas{top:calc(168px + env(safe-area-inset-top,0px));right:10px;width:calc(50% - 15px);padding:8px 10px}#meas h3{font-size:15px}#meas .v{font-size:13px}#meas .k{font-size:12px}#meas .note{display:none}
  #ctl{left:8px;right:8px;transform:none;width:auto;min-width:0;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #lily{left:10px;bottom:auto;top:calc(168px + env(safe-area-inset-top,0px));max-width:calc(50% - 15px);min-width:0}#lily svg{display:none}#say{font-size:13.5px}
  #panel{width:calc(100% - 20px);min-width:0;top:calc(170px + env(safe-area-inset-top,0px))}
  #panel .opts{grid-template-columns:1fr}
}

/* 261120 자르기 풀이 화면: 장 목록은 번호만, 왼쪽 잘린면 풀이 · 아래 정면 풀이(릴리 포함) · 진한 갈색 지시선 · 누르면 초록 형광 */
body.cutmode #left{width:52px}
body.cutmode .mm-bar{left:12px!important;top:calc(404px + env(safe-area-inset-top,0px))!important;bottom:auto!important;flex-direction:column!important;max-width:58px!important}
body.cutmode .mm-bar>*{white-space:nowrap!important;font-size:11px!important;padding:3px 5px!important}
body.cutmode .ch{justify-content:center;padding:6px 4px}
body.cutmode .ch .t,body.cutmode .ch .g,body.cutmode .ch .ok{display:none}
body.cutmode #fcards,body.cutmode #meas{display:none!important}
body.cutmode #ctl{width:min(460px,calc(100% - 640px));min-width:380px}
.sol{position:fixed;z-index:9;padding:12px 14px;background:rgba(255,253,249,.4);border-color:rgba(214,199,174,.75);box-shadow:0 4px 14px rgba(86,62,30,.10);backdrop-filter:none;-webkit-backdrop-filter:none;
  text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 7px #fff,0 0 1px #fff;transition:box-shadow .2s}
.sol button{text-shadow:none}
.sol h3{margin:0 0 6px;font-family:var(--serif);font-size:19.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sol .play{padding:5px 12px;font-size:14px}
.sol ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sol li{font-size:16.2px;line-height:1.48;padding:4px 8px;border-radius:8px;cursor:pointer;transition:background .2s,box-shadow .2s}
.sol li:hover{background:rgba(252,230,211,.6)}
.sol li.on{background:#D9FF7A;box-shadow:0 0 0 2px #A3FF00,0 0 14px 3px rgba(163,255,0,.55)}
.sol.sel{box-shadow:0 0 0 3px #A3FF00,0 0 22px 6px rgba(163,255,0,.45)}
#solL{left:74px;top:calc(70px + env(safe-area-inset-top,0px));width:340px;overflow-y:auto}
#solB{left:74px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
#solB #lily{position:static;max-width:none;min-width:0;display:flex;align-items:flex-end;gap:8px}
#solB #lily svg{width:44px;height:52px;display:block}
#solB #say{font-size:16px;background:rgba(255,253,249,.72)}
#solB h3.tt{display:inline-flex}
#solB .fb{display:grid;grid-template-columns:136px 1fr;gap:12px;align-items:start}
.fsvg{width:136px;height:136px;overflow:visible}
.fsvg .gr{stroke:#9A9A9A;stroke-width:.8;stroke-dasharray:3 2.5;opacity:.7}
.fsvg .sq{fill:#FFFDF9}.fsvg .sq.on{fill:#B6FF5C}
.fsvg .sub{fill:rgba(47,123,234,.2);transition:fill .2s}.fsvg .sub.on{fill:#B6FF5C}
.fsvg .cut{stroke:#C45A17;stroke-width:3.4;stroke-linecap:round}.fsvg .cut.on{stroke:#39D40F;filter:drop-shadow(0 0 3px #A3FF00)}
.fsvg .nl{font:700 11px var(--mono);fill:#D9601A;text-anchor:middle;paint-order:stroke;stroke:#FFFDF9;stroke-width:3}
.fsvg .nl.on{fill:#2E8A00}
.fsvg .bl{font:700 10.5px var(--mono);fill:#1F5FD1;text-anchor:middle}

  for(let i=0;i<arr.length;i+=9){const v=[P(i),P(i+3),P(i+6)];const d=v.map(p=>n.x*p[0]+n.y*p[1]+n.z*p[2]-k);const pts=[];
    for(let e=0;e<3;e++){const a=e,b=(e+1)%3;if((d[a]>=0)!==(d[b]>=0)){const t=d[a]/(d[a]-d[b]);pts.push([v[a][0]+(v[b][0]-v[a][0])*t,v[a][1]+(v[b][1]-v[a][1])*t,v[a][2]+(v[b][2]-v[a][2])*t])}}
    if(pts.length===2)segs.push(pts)}
  if(!segs.length)return null;
  const key=p=>p.map(x=>Math.round(x*2e3)).join(',');const adj=new Map();
  segs.forEach((s,i)=>{for(const j of[0,1]){const kk=key(s[j]);if(!adj.has(kk))adj.set(kk,[]);adj.get(kk).push(i)}});
  const used=new Uint8Array(segs.length);let best=null;
  for(let s0=0;s0<segs.length;s0++){if(used[s0])continue;used[s0]=1;const loop=[segs[s0][0],segs[s0][1]];let cur=segs[s0][1];
    for(let guard=0;guard<segs.length;guard++){const lst=adj.get(key(cur))||[];let nx=-1;for(const i of lst)if(!used[i]){nx=i;break}if(nx<0)break;used[nx]=1;const s=segs[nx];const o=key(s[0])===key(cur)?s[1]:s[0];loop.push(o);cur=o}
    if(!best||loop.length>best.length)best=loop}
  // 2D 좌표
  const N=n.clone();const U=Math.abs(N.y)<.9?new THREE.Vector3().crossVectors(N,V3(0,1,0)).normalize():new THREE.Vector3().crossVectors(N,V3(1,0,0)).normalize();const W=new THREE.Vector3().crossVectors(N,U);
  let p2=best.map(p=>[p[0]*U.x+p[1]*U.y+p[2]*U.z,p[0]*W.x+p[1]*W.y+p[2]*W.z]);
  // 겹친 점·일직선 점 지우기
  const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);p2=p2.filter((p,i)=>i===0||dd(p,p2[i-1])>1e-4);if(p2.length>2&&dd(p2[0],p2[p2.length-1])<1e-4)p2.pop();
  let area=0;for(let i=0;i<p2.length;i++){const a=p2[i],b=p2[(i+1)%p2.length];area+=a[0]*b[1]-b[0]*a[1]}area/=2;if(area<0){p2.reverse();area=-area}
  let corners=p2.filter((p,i)=>{const a=p2[(i-1+p2.length)%p2.length],b=p2[(i+1)%p2.length];const ux=p[0]-a[0],uy=p[1]-a[1],vx=b[0]-p[0],vy=b[1]-p[1];const cr=Math.abs(ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)+1e-12);return cr>2e-3});
  const sides=corners.map((p,i)=>dd(p,corners[(i+1)%corners.length]));
  return{p2,U,W,N,k,area,corners,sides,pts3:best}}

  const ghost=new THREE.Mesh(geo,MAT.ghost());ghost.visible=false;const gEdge=new THREE.LineSegments(new THREE.EdgesGeometry(geo,28),MAT.edge());gEdge.visible=false;ghost.add(gEdge);target.parent.add(ghost);ghost.position.copy(target.position);ghost.rotation.copy(target.rotation);ghost.scale.copy(target.scale);
  const capM=MAT.cap();let cap=null,capG=null,outline=null;
  const planeVis=new THREE.Group();const pvFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xF6B17A,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false}));planeVis.add(pvFill);
  const pvLine=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([V3(-.5,-.5,0),V3(.5,-.5,0),V3(.5,.5,0),V3(-.5,.5,0)]),new THREE.LineBasicMaterial({color:0xE8742A,transparent:true,opacity:.75}));planeVis.add(pvLine);
  STAGE.add(planeVis);planeVis.visible=false;
  const bb=new THREE.Box3().setFromBufferAttribute(new THREE.BufferAttribute(arr,3));const ctr=bb.getCenter(new THREE.Vector3());const size=bb.getSize(new THREE.Vector3()).length()*1.05;
  function normal(){if(C.mode==='free')return C.nFix.clone();if(C.mode==='front')return V3(0,0,1);if(C.mode==='side')return V3(1,0,0);if(C.mode==='top')return V3(0,1,0);
    const d=C.tiltDir;return V3(d.x*Math.sin(C.theta),Math.cos(C.theta),d.z*Math.sin(C.theta)).normalize()}

    [cap,capG,outline].forEach(o=>{if(o){o.parent&&o.parent.remove(o);o.geometry.dispose()}});cap=capG=outline=null;C.info=null;C.capMesh=null}
  function apply(){clear();if(C.mode==='none'||Math.abs(C.s)<.004){C.onChange&&C.onChange(C);return}
    const n=normal();const[mn,mx]=extent(arr,n);const c=(mn+mx)/2;const a=Math.abs(C.s);

    target.material.clippingPlanes=[keep];target.material.needsUpdate=true;if(target.userData.edges){target.userData.edges.material.clippingPlanes=[keep];target.userData.edges.material.needsUpdate=true}
    const away=n.clone().multiplyScalar(-sign);const liftD=C.lift?Math.max(2.6,size*.45):0;C.away=away;C.liftD=liftD;const loseMoved=lose.clone().translate(away.clone().multiplyScalar(liftD));ghost.material.clippingPlanes=[loseMoved];Object.assign(ghost.material,C.lift?{transparent:false,opacity:1,depthWrite:true}:{transparent:true,opacity:.1,depthWrite:false});ghost.material.needsUpdate=true;ghost.castShadow=C.lift;ghost.receiveShadow=C.lift;gEdge.visible=C.lift;gEdge.material.clippingPlanes=[loseMoved];gEdge.material.needsUpdate=true;ghost.visible=true;ghost.position.copy(target.position).addScaledVector(away,liftD);
    const S=section(arr,n,k);C.info=S;C.n=n;C.k=k;C.sign=sign;
    if(S&&S.p2.length>=3){const sh=new THREE.Shape(S.p2.map(p=>new THREE.Vector2(p[0],p[1])));const g=new THREE.ShapeGeometry(sh);const M=new THREE.Matrix4().makeBasis(S.U,S.W,n).setPosition(n.clone().multiplyScalar(k));

      capG=new THREE.Mesh(g.clone(),MAT.cap());capG.castShadow=true;capG.position.copy(away).multiplyScalar(C.lift?Math.max(2.6,size*.45):0);capG.visible=C.lift;STAGE.add(capG);

  let n=0,busy=false;meas([[D('부은 횟수','Số lần rót','Pours'),'0 / 3',1]]);

  row(pb,rs);say(D('원뿔 컵에 물을 담아 똑같은 밑면과 높이의 원기둥에 부어 보자. 몇 번 부어야 가득 찰까?','Đổ nước vào cốc hình nón rồi rót sang hình trụ cùng đáy, cùng chiều cao. Rót mấy lần thì đầy?','Fill the cone cup and pour it into a cylinder with the same base and height. How many pours to fill it?'))},
 use(){let Dm=3,Hm=1.2;setView({t:[0,2,0],d:26,yaw:.6,pitch:.5});let pile=null;
  const sandTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#D9B98A';g.fillRect(0,0,w,h);let s=3;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<9000;i++){g.fillStyle=`rgba(${120+rnd()*80|0},${90+rnd()*60|0},${50+rnd()*40|0},${.25+rnd()*.3})`;g.fillRect(rnd()*w,rnd()*h,1.5,1.5)}});sandTex.wrapS=sandTex.wrapT=THREE.RepeatWrapping;
  function make(){if(pile){STAGE.remove(pile);pile.geometry.dispose()}const sc=8/Math.max(Dm,Hm*2);const r=Dm/2*sc,h=Hm*sc;const g=new THREE.ConeGeometry(r,h,96,8);g.translate(0,h/2,0);

  const disk=new THREE.Mesh(new THREE.CircleGeometry(R0+.6,96),new THREE.MeshStandardMaterial({color:0xFFFDF8,roughness:.8,side:THREE.DoubleSide,transparent:true,opacity:.9}));disk.rotation.y=PI/2;disk.position.set(x0-.05,cy,0);disk.castShadow=true;STAGE.add(disk);

  wgrid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(x0,cy,wallZ+.012),V3(x0+L+1,cy,wallZ+.012)]),new THREE.LineBasicMaterial({color:0x9A8C77})));STAGE.add(wgrid);
  const axis=new THREE.ArrowHelper(V3(1,0,0),V3(x0,cy,0),L+1.2,0x9A8C77,.6,.35);STAGE.add(axis);

 // 돌아가는 화살표 하나 + 나선 + 벽 물결
 phasor(S,color,phase,opt={}){const N=360;const {R0,cy,x0,L,wallZ}=S;const amp=opt.amp||R0;
  const arrow=new THREE.ArrowHelper(V3(0,1,0),V3(x0,cy,0),amp,color,.7,.45);arrow.line.material.linewidth=2;STAGE.add(arrow);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(.22,20,14),new THREE.MeshStandardMaterial({color,roughness:.4}));STAGE.add(tip);tip.castShadow=true;
  const helixG=new THREE.BufferGeometry();helixG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));const helix=new THREE.Line(helixG,new THREE.LineBasicMaterial({color}));STAGE.add(helix);
  const wallG=new THREE.BufferGeometry();wallG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));const wl=new THREE.Line(wallG,new THREE.LineBasicMaterial({color}));STAGE.add(wl);
  const floorG=new THREE.BufferGeometry();floorG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));const fl=new THREE.Line(floorG,new THREE.LineBasicMaterial({color,transparent:true,opacity:.45}));STAGE.add(fl);
  const drop=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(),V3()]),new THREE.LineDashedMaterial({color,dashSize:.25,gapSize:.18}));STAGE.add(drop);
  const o={arrow,tip,helix,wl,fl,phase,amp,color,show:{helix:true,wall:true,floor:opt.floor!==false}};
  o.update=(ang,cyc)=>{const a=ang+o.phase;const dy=Math.sin(a)*o.amp,dz=Math.cos(a)*o.amp;arrow.setDirection(V3(0,dy,dz).normalize());tip.position.set(x0,cy+dy,dz);
    const hp=helix.geometry.attributes.position,wp=wl.geometry.attributes.position,fp=fl.geometry.attributes.position;
    for(let i=0;i<N;i++){const u=i/(N-1);const x=x0+u*L;const aa=a-u*cyc*2*PI;const y=cy+Math.sin(aa)*o.amp,z=Math.cos(aa)*o.amp;hp.setXYZ(i,x,y,z);wp.setXYZ(i,x,y,wallZ+.03);fp.setXYZ(i,x,.02,z)}
    hp.needsUpdate=wp.needsUpdate=fp.needsUpdate=true;helix.visible=o.show.helix;wl.visible=o.show.wall;fl.visible=o.show.floor;
    drop.geometry.setFromPoints([V3(x0,cy+dy,dz),V3(x0,cy+dy,wallZ+.03)]);drop.computeLineDistances();drop.visible=o.show.wall};
  return o},
 viewBtns(){const VW={tilt:{t:[3.5,4.2,0],d:34,yaw:.5,pitch:.3},side:{t:[3.5,5,-1],d:32,yaw:0,pitch:.04},front:{t:[-8.5,5,0],d:15,yaw:-PI/2,pitch:.02},top:{t:[3.5,0,0],d:34,yaw:0,pitch:1.42}};

  const tg=tag(D('나선','Đường xoắn','Helix'),()=>V3(S.x0+S.L*.62,S.cy+S.R0+.8,S.R0*.7),'acc'),tw=tag(D('벽에 비친 물결 (sin)','Sóng trên tường (sin)','Wave on the wall (sin)'),()=>V3(S.x0+S.L*.4,S.cy+S.R0+1.4,S.wallZ),'y');
  tick((now,dt)=>{if(run)ang+=dt*speed*2*PI;P.update(ang,2);const deg=((ang%(2*PI))+2*PI)%(2*PI)/DEG;if(Math.floor(now/120)!==this._m){this._m=Math.floor(now/120);

  ctl.appendChild(slider(D('도는 빠르기','Tốc độ quay','Speed'),0,1.5,.05,speed,v=>v.toFixed(2)+'×',v=>speed=v));row(this.viewBtns(),pb);
  say(D('전기는 눈에 안 보이지만 이렇게 생각하면 돼. 화살표가 빙글빙글 돌고, 시간을 옆으로 쭉 늘이면 나선이 돼. 옆에서 보면 그게 물결이야!','Điện không nhìn thấy được, nhưng hãy tưởng tượng thế này: mũi tên quay tròn, kéo dài thời gian sang bên thì thành đường xoắn. Nhìn ngang thì đó là sóng!','You cannot see electricity, but picture this: an arrow spins; stretch time sideways and you get a helix. From the side, it is a wave!'))},
 shift(){const S=this.stage();let ph=40,ang=0,run=true,speed=.35;const V=this.phasor(S,0xE8742A,0),I=this.phasor(S,0x3B82A0,-ph*DEG,{amp:S.R0*.72,floor:false});V.show.floor=false;
  const tv=tag(D('전압','Điện áp','Voltage'),()=>V.tip.position,'acc'),ti=tag(D('전류','Dòng điện','Current'),()=>I.tip.position);
  tick((now,dt)=>{if(run)ang+=dt*speed*2*PI;V.update(ang,2);I.update(ang,2)});

  ctl.appendChild(slider(D('엇갈린 각도','Góc lệch','Phase gap'),0,180,5,ph,v=>v+'°',v=>{ph=v;I.phase=-v*DEG;show();if(v===90)say(D('90°면 전압이 꼭대기일 때 전류는 0이야. 코일만 있을 때 이렇게 돼.','Lệch 90° thì khi điện áp ở đỉnh, dòng điện bằng 0. Chỉ có cuộn dây thì sẽ như vậy.','At 90°, when the voltage peaks the current is zero. A pure coil does this.'))}));
  const pb=btn(D('멈춤','Dừng','Pause'),()=>{run=!run;pb.textContent=T(run?D('멈춤','Dừng','Pause'):D('재생','Chạy','Play'))});row(this.viewBtns(),pb);show();

 {id:'a3',skill:'tri',grade:D('4학년(한국) · lớp 7(VN)','Lớp 4 (Hàn) · lớp 7 (VN)','Grade 4 (KR)'),level:3,gen(v){const s=[[50,60],[45,75],[30,90],[80,35]][v%4];return{x:s[0],y:s[1],ans:180-s[0]-s[1]}},

  ways:o=>[{t:KB,s:[D(`두 각 먼저: ${o.x} + ${o.y} = ${o.x+o.y}`,`Cộng hai góc trước: ${o.x} + ${o.y} = ${o.x+o.y}`,`Add the two first: ${o.x} + ${o.y} = ${o.x+o.y}`),D(`${o.x+o.y}에서 180까지 거꾸로 세기 → ${o.ans}°`,`Đếm từ ${o.x+o.y} lên 180 → ${o.ans}°`,`Count up from ${o.x+o.y} to 180 → ${o.ans}°`)]},{t:D('릴리의 풀이 ② 찢어 붙이기','Cách của Lily ② Xé và ghép',"Lily's way ② Tear and line up"),s:[D('종이 삼각형의 세 꼭짓점을 찢어 한 점에 모으면 곧은 선 = 180°','Xé ba đỉnh tam giác giấy ghép lại một điểm thành đường thẳng = 180°','Tear the three corners of a paper triangle and put them together: a straight line = 180°'),D(`→ ${o.ans}°`,`→ ${o.ans}°`,`→ ${o.ans}°`)]}],
  why:o=>({q:D('정말 모든 삼각형의 세 각이 180°일까? 아주 뾰족한 삼각형도? 그럼 사각형은?','Có thật mọi tam giác đều có tổng 180°? Cả tam giác rất nhọn? Vậy tứ giác thì sao?','Is it really 180° for every triangle, even a very pointy one? What about a quadrilateral?'),a:D('찢어 붙이면 언제나 곧은 선이 돼서 180°야. 사각형은 대각선 하나로 삼각형 2개가 되니까 180 × 2 = 360°.','Xé ghép luôn thành đường thẳng nên 180°. Tứ giác chia bởi một đường chéo thành 2 tam giác nên 180 × 2 = 360°.','Torn corners always make a straight line, so 180°. A quadrilateral splits into 2 triangles: 360°.')}),

   return SVG(`<polygon points="${A} ${B} ${Cc}" fill="#fff" stroke="#1D2328" stroke-width="2.5"/><text x="${A[0]+26}" y="${A[1]-8}" font-size="14" font-weight="700" fill="#1F5FD1">${o.x}°</text><text x="${B[0]-48}" y="${B[1]-8}" font-size="14" font-weight="700" fill="#1F5FD1">${o.y}°</text><text class="w" x="${Cc[0]-6}" y="${Cc[1]+30}" font-size="18" font-weight="800" fill="#C45A17">?</text><line class="g" x1="20" y1="180" x2="240" y2="180" stroke="rgba(57,212,15,0)" stroke-width="4"/>`)},
  onsite:D('현장에서는: 지붕 삼각형 틀을 만들 때 두 각을 정하면 나머지 각이 저절로 정해져.','Ngoài thực tế: làm khung mái tam giác, chọn hai góc thì góc thứ ba tự có.','On site: for a triangular roof frame, two angles fix the third.')},

  why:o=>({q:D('평행사변형을 더 기울이면 이웃한 두 각의 합은 바뀔까? 직사각형일 때는?','Nghiêng hình bình hành nhiều hơn thì tổng hai góc kề có đổi không? Hình chữ nhật thì sao?','If you tilt the parallelogram more, does the sum change? What about a rectangle?'),a:D('안 바뀌어. 한쪽이 줄어든 만큼 다른 쪽이 늘어서 늘 180°. 직사각형은 90 + 90 = 180.','Không đổi. Góc này giảm bao nhiêu thì góc kia tăng bấy nhiêu, luôn 180°. Hình chữ nhật: 90 + 90 = 180.','No. What one loses the other gains, always 180°. A rectangle: 90 + 90 = 180.')}),

function makeInk(cv){const g=cv.getContext('2d');let strokes=[],cur=null,penSeen=false,tool='pen',col='#1D2328';const dpr=Math.min(devicePixelRatio||1,2);
  function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);draw()}
  function draw(){g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cv.width,cv.height);g.lineCap='round';g.lineJoin='round';
    for(const s of strokes){g.strokeStyle=s.c;g.lineWidth=s.w;g.beginPath();s.p.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(s.p.length===1)g.lineTo(s.p[0][0]+.1,s.p[0][1]);g.stroke()}}
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const p=pos(e);if(tool==='erase'){eraseAt(p);cur={erase:true};}else{cur={c:col,w:col==='#1D2328'?2.6:3.2,p:[p]};strokes.push(cur);draw()}ink.onAct&&ink.onAct()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;if(penSeen&&e.pointerType==='touch')return;const p=pos(e);if(cur.erase){eraseAt(p);return}const l=cur.p[cur.p.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)return;cur.p.push(p);draw();ink.onAct&&ink.onAct()});
  const up=()=>{cur=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function eraseAt(p){const n=strokes.length;strokes=strokes.filter(s=>!s.p.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<14));if(strokes.length!==n)draw()}
  const ink={fit,clear(){strokes=[];draw()},undo(){strokes.pop();draw()},set tool(t){tool=t},set color(c){col=c;tool='pen'},used:()=>strokes.length>0,
    snap(){try{const s=document.createElement('canvas');const k=.35;s.width=Math.max(1,cv.width*k/dpr);s.height=Math.max(1,cv.height*k/dpr);const sg=s.getContext('2d');sg.fillStyle='#fff';sg.fillRect(0,0,s.width,s.height);sg.drawImage(cv,0,0,s.width,s.height);return s.toDataURL('image/jpeg',.6)}catch(e){return null}}};
  cv.style.touchAction='none';return ink}

  const imgs=L.filter(r=>r.img);if(imgs.length){const g=el('div','imgs');imgs.slice(-6).forEach(r=>{const f=el('figure');const im=el('img');im.src=r.img;im.alt='';const c=el('figcaption');c.textContent=`${T(SK[r.skill])} · ${r.status==='done'?'✓':r.status==='hold'?'⏸':'↻'}`;f.append(im,c);g.appendChild(f)});p.appendChild(g)}

  const asks=L.reduce((s,r)=>s+(r.ask||0),0);if(asks){const ad=el('div','why');ad.textContent=T(D(`질문 단추를 ${asks}번 눌렀어. 문제 문장이 어려웠던 곳이야.`,`Con đã bấm hỏi ${asks} lần, chỗ đề bài còn khó hiểu.`,`Asked ${asks} questions, where the wording was hard.`));p.appendChild(ad)}
  const rw=el('div','row');rw.appendChild(btn(D('문제 더 풀기','Giải thêm','More problems'),()=>openCh(S,'solve'),'pill pri'));if(hold.length)rw.appendChild(btn(D(`보류 ${hold.length}개 다시`,`Làm lại ${hold.length} bài`,`Retry ${hold.length}`),()=>{openCh(S,'solve');later(()=>{const b=[...document.querySelectorAll('#ctl .pill')].find(x=>x.textContent.includes(hold.length));b&&b.click()},50)}));p.appendChild(rw);

function kgr(x){const k=curKey();if(k==='ko')return x;return x.replace(/초(\d)/g,(_,n)=>(k==='vi'?'lớp ':'G')+n).replace(/중(\d)/g,(_,n)=>(k==='vi'?'lớp ':'G')+(+n+6)).replace('~','–')}

function termNow(C){// 오늘 날짜로 이번 학기와 지금쯤 단원 추정 (단원별 차시 수로 가중) · 직접 고르면 그걸로
  const now=new Date(),Y=now.getFullYear();const span=w=>{let a=new Date(Y,w[0],w[1]),b=new Date(Y,w[2],w[3]);if(b<a){if(now<b)a.setFullYear(Y-1);else b.setFullYear(Y+1)}return[a,b]};
  let ti=-1,prog=0;C.win.forEach((w,i)=>{const[a,b]=span(w);if(now>=a&&now<=b){ti=i;prog=(now-a)/(b-a)}});
  if(ti<0){ti=0;prog=0;C.win.forEach((w,i)=>{const[a]=span(w);if(a>now&&ti===0)ti=i})}
  const T0=C.terms[ti];const saved=store.get('cur_'+curKey()+'_'+ti);let idx=0;
  if(saved!=null)idx=Math.min(T0.u.length-1,+saved);else{const ws=T0.u.map(u=>u[2]||1),tot=ws.reduce((a,b)=>a+b,0);let acc=0;idx=T0.u.length-1;for(let j=0;j<ws.length;j++){acc+=ws[j];if(prog*tot<acc){idx=j;break}}}

bar.innerHTML='<b>그리기</b><button data-c="#b3261e" style="--k:#b3261e" aria-pressed="true">빨강</button><button data-c="#1d6fb8" style="--k:#1d6fb8" aria-pressed="false">파랑</button><button data-c="#15803d" style="--k:#15803d" aria-pressed="false">초록</button><button data-c="#1d2328" style="--k:#1d2328" aria-pressed="false">검정</button><button class="da" aria-pressed="false">→ 화살표</button><button class="dsm" aria-pressed="false" title="켜면 그린 선을 직선·원·네모·세모로 다듬습니다 (기본은 그린 그대로)">다듬기</button><input class="dl" placeholder="다음 선에 붙일 글(선택)" maxlength="40"><button class="de" aria-pressed="false">지우개</button><button class="du">되돌리기</button><button class="dx">닫기</button>';
document.body.appendChild(bar);
const say=t=>{let m=document.getElementById('tnote');if(!m&&t){m=document.createElement('div');m.id='tnote';m.className='mm-ui';document.body.appendChild(m)}if(m&&t){m.textContent=t;m.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>{m.hidden=true},2500)}};
bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;bar.querySelector('.de').setAttribute('aria-pressed','false');bar.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
bar.querySelector('.dsm').onclick=function(){smooth=!smooth;this.setAttribute('aria-pressed',smooth);say(smooth?'다듬기 켬 · 직선·원·네모로 맞춥니다':'다듬기 끔 · 그린 그대로 남깁니다')};
bar.querySelector('.da').onclick=function(){arrow=!arrow;this.setAttribute('aria-pressed',arrow)};
bar.querySelector('.de').onclick=function(){erase=!erase;this.setAttribute('aria-pressed',erase);if(!erase)ring.style.display='none'};
bar.querySelector('.du').onclick=()=>{if(!HIST.length)return;D=JSON.parse(HIST.pop());render();changed()};
bar.querySelector('.dx').onclick=()=>setMode(false);
let btn=null;
const tablet=()=>document.documentElement.classList.contains('mm-penonly')||matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
function setMode(on){const was=mode;mode=on;window.__mmLock&&window.__mmLock(on);document.documentElement.classList.toggle('mm-drawing',on);if(tablet()&&was!==on)say(on?'그리기 중 · 화면이 고정됩니다 (닫기나 ✏️ 그리기를 다시 누르면 풀림)':'화면 이동이 다시 됩니다');if(btn)btn.setAttribute('aria-pressed',on);if(!on){erase=false;bar.querySelector('.de').setAttribute('aria-pressed','false');ring.style.display='none'}render()}
/* 그리기: 펜·마우스만 (손가락은 화면 이동) */
addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(e.pointerType==='touch')tch++},true);addEventListener('pointerup',e=>{if(e.pointerType==='touch')tch=Math.max(0,tch-1)},true);addEventListener('pointercancel',e=>{if(e.pointerType==='touch')tch=Math.max(0,tch-1)},true);
/* 펜·마우스로 그림. 펜이 없는 태블릿은 손가락 하나로도 그림(두 손가락 이상·손바닥은 무시) */
layer.addEventListener('pointerdown',e=>{if(!mode||(e.pointerType==='touch'&&(penSeen||tch>1||(e.width||0)>=50))||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();e.stopPropagation();
 if(erase){er=e.pointerId;eraseAt(e);return}cur=e.pointerId;pts=[toMM(e)];try{layer.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(cur!=null&&e.pointerId===cur&&e.pointerType==='touch'&&tch>1){cur=null;pts=[];render();return}const on=mode&&erase&&e.pointerType!=='touch';ring.style.display=on?'block':'none';if(on){ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px'}
 if(er!=null&&e.pointerId===er){eraseAt(e);return}if(cur==null||e.pointerId!==cur)return;const p=toMM(e);if(dist(p,pts[pts.length-1])>.5){pts.push(p);render()}});
const endStroke=e=>{if(er!=null&&e.pointerId===er){er=null;return}if(cur==null||e.pointerId!==cur)return;cur=null;const f=smooth?fit(pts):free(pts);pts=[];
 if(f){snap();f.c=color;if(arrow&&f.k!=='ellipse')f.a=1;const li=bar.querySelector('.dl'),lab=li.value.trim();if(lab){f.t=lab;li.value=''}D.push(f);changed();if(smooth)say(f.k==='line'?'직선으로 다듬었습니다':f.k==='ellipse'?'원으로 다듬었습니다':f.z?'도형으로 다듬었습니다':'선으로 다듬었습니다')}render()};addEventListener('pointerup',endStroke);addEventListener('pointercancel',endStroke);
addEventListener('keydown',e=>{if(e.key==='Escape'&&mode)setMode(false)});
addEventListener('resize',()=>requestAnimationFrame(render));
try{new ResizeObserver(()=>requestAnimationFrame(render)).observe(HOST)}catch(_){}
/* 메모 줄에 단추 넣기 (인쇄 다음) */
function addBtn(){const mb=document.querySelector('.mm-bar');if(!mb)return false;if(mb.querySelector('.mm-draw'))return true;btn=document.createElement('button');btn.type='button';btn.className='mm-draw';btn.textContent='✏️ 그리기';btn.title='문서 위에 선·화살표·원 그리기 (Esc로 끄기)';btn.setAttribute('aria-pressed','false');btn.onclick=e=>{e.preventDefault();setMode(!mode)};
 const pr=mb.querySelector('.mm-print');if(pr)pr.after(btn);else mb.insertBefore(btn,mb.firstChild);return true}
if(!addBtn()){let n=0;const iv=setInterval(()=>{if(addBtn()||++n>40)clearInterval(iv)},250)}
/* 불러오기 */
try{const j=localStorage.getItem('mm-draw:'+document.title);if(j)D=JSON.parse(j)||[]}catch(_){}
render();
(async()=>{if(!(window.claude&&claude.use))return;try{DB=await claude.use('db');if(!DB)return;dref=DB.doc('memo/draw');const sn=await Promise.race([dref.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);if(sn&&sn.exists){const d=sn.data();if(d&&d.json){D=JSON.parse(d.json)||[];render()}}}catch(_){}})();
})();
</script>
<style id="mm-book">
/* 261120 아이 인터넷 책용: 메모 막대를 왼쪽 목차 아래 빈 곳에(3D 조종판·조이스틱·말풍선과 안 겹치게) */

.mm-bar button{font-size:12px!important;padding:5px 7px!important}
.mm-panel{left:22px!important;right:auto!important;bottom:110px!important}
.mm-devmenu{left:22px!important;right:auto!important;bottom:110px!important}
</style>
